<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZL Food | Recuperar Senha</title>

    <!-- Mantendo o mesmo padrão de fontes do seu projeto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- Link para o arquivo de estilo que vamos criar -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main>
        <div class="container-recuperar">

            <!-- Voltar para o Login -->
            <div class="voltar">
                <a href="index.html">
                    <ion-icon name="arrow-back-outline"></ion-icon> Voltar para o Login
                </a>
            </div>

            <div class="cabecalho">
                <ion-icon name="lock-open-outline" id="icone-cadeado"></ion-icon>
                <h2>Recuperar Senha</h2>
                <p>Digite o seu e-mail cadastrado. Enviaremos um link para você criar uma nova senha.</p>
            </div>

            <!-- Formulário Simples -->
            <form id="form-recuperar">
                <div class="campo-email">
                    <label for="email">E-Mail de Cadastro</label>
                    <div class="input-com-icone">
                        <ion-icon name="mail-outline"></ion-icon>
                        <input type="email" id="email" placeholder="seu-email@exemplo.com" required>
                    </div>
                </div>

                <button type="submit" id="btn-enviar">Enviar Link de Recuperação</button>
            </form>

        </div>
    </main>

    <!-- Script dos Ícones (Igual ao seu) -->
    <script src="assets/js/app.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
