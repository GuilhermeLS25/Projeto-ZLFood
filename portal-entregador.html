<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZL Food - Portal do Motoboy </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/site.webmanifest">
</head>

<body>

    <div class="app-container">

        <div class="sidebar-panel">

            <div class="sidebar-top">
                <div class="top-navigation-bar">
                    <div class="nav-instruction">
                        <div class="nav-icon-turn">
                            <i class="fa-solid fa-arrow-turn-up"></i>
                        </div>
                        <div class="nav-text">
                            <p>A 300 metros</p>
                            <h4>Vire à esquerda na Av. Principal</h4>
                        </div>
                    </div>
                    <div class="earning-badge">
                        Valor da Rota: R$ 14,50
                    </div>
                </div>

                <div class="status-header">
                    <span class="status-badge">A Caminho</span>
                    <span class="order-number">Pedido #8841</span>
                </div>

                <div class="address-info">
                    <div class="address-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div class="address-text">
                        <h3>Ponto da Pizza (Origem)</h3>
                        <p>Av. Antônio Prado Lyra, 605 - Vila Assis</p>
                    </div>
                </div>

                <div class="quick-actions">
                    <button class="btn-quick" onclick="alert('Ligando para o estabelecimento/suporte...')">
                        <i class="fa-solid fa-phone"></i> Ligar
                    </button>
                    <button class="btn-quick" onclick="alert('Abrindo chat interno do ZL Food...')">
                        <i class="fa-solid fa-comment"></i> Chat (2)
                    </button>
                </div>
            </div>

            <button class="btn-primary-action"
                onclick="alert('Gatilho JavaScript acionado: Direcionando para a Tela 13 (Scanner de Segurança) para ativação da câmera.')">
                CHEGUEI AO LOCAL
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <div class="divisor"></div>
            <div class="sidebar-top">
                <div class="status-header">
                    <span class="order-number">Pedido #8842</span>
                    <div class="earning-badge">R$ 12,00</div>
                </div>

                <div class="address-info">
                    <div class="address-icon">
                        <i class="fa-solid fa-store"></i>
                    </div>
                    <div class="address-text">
                        <h3>Sushi Express <span>(A 1.8 km)</span></h3>
                    </div>
                </div>
            </div>

            <button class="btn-primary-action" onclick="alert('Você pegou o Pedido #8843!')">
                PEGAR PEDIDO
                <i class="fa-solid fa-motorcycle"></i>
            </button>

        </div>

        <div class="map-wrapper">
            <iframe
                src="https://www.google.com/maps/d/u/1/embed?mid=1uiDwkYZ9-nQNwFieEKEQEn62XLI4m60&ehbc=2E312F&noprof=1"></iframe>
        </div>

    </div>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&display=swap" rel="stylesheet">
</body>

</html>
