<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZL Food | Cadastro</title>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Kadwa:wght@400;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<style>
    body {
        background-image: url(assets/images/fundo-dark.png);
        background-repeat: no-repeat;
        background-size: cover;
    }
</style>

<body class="pg-cadastro">

    <header class="header-main">
        <div class="divisoria"></div>

        <div class="mensagem">
            <h1 class="bemVindo">Cadastre-se</h1>
            <p class="deVolta">Agora!</p>
        </div>
    </header>

    <main>
        <form id="cadastro-form" action="#" method="POST">
            <div class="login">
                <div class="voltar1">
                    <a href="index.html">
                        <ion-icon name="arrow-back-outline"></ion-icon> Voltar para o Login
                    </a>
                </div>
                <div class="campos">

                    <div class="conta">
                        <ion-icon id="home1" name="person-add-outline"></ion-icon>
                        <h2 id="acesseConta">Cadastre sua Conta</h2>
                    </div>
                    <label class="email-label">Nome</label>
                    <div class="email">
                        <ion-icon name="person"></ion-icon>
                        <input id="nome" class="email" placeholder="Nome Completo" type="text" required>
                    </div>
                    <label class="email-label">E-Mail</label>
                    <div class="email">
                        <ion-icon name="mail"></ion-icon>
                        <input id="email" class="email" placeholder="Digite seu e-mail" type="email" required>
                    </div>


                    <label class="senha-label">Senha</label>
                    <div class="senha">
                        <ion-icon name="lock-closed"></ion-icon>
                        <input id="senha" class="senha" placeholder="Crie uma senha" type="password" required>
                    </div>

                    <div class="senha">
                        <ion-icon name="checkmark-circle-outline"></ion-icon>
                        <input id="confirme-senha" class="senha" placeholder="Confirme sua senha" type="password"
                            required>
                    </div>
                </div>

                <div class="termos-container">
                    <label class="checkbox-label">
                        <input type="checkbox" id="aceitarTermos" />
                        <span class="custom-checkbox"></span>
                        <span class="termos-texto">
                            Eu li e aceito os <a href="#" class="termos-link">Termos de Uso</a> e a <a href="#"
                                class="termos-link">Política de Privacidade</a>.
                        </span>
                    </label>
                </div>

                <fieldset id="perfil">
                    <legend>Selecione seu Perfil</legend>
                    <div class="opcoes-perfil">

                        <label class="card-perfil">
                            <ion-icon name="fast-food-outline" class="icone-card"></ion-icon>

                            <div class="texto-card">
                                <strong>Cliente</strong>
                                <span>Fazer Pedidos</span>
                            </div>

                            <input type="radio" name="perfil" value="cliente" checked required>
                            <span class="custom-radio"></span>
                        </label>

                        <label class="card-perfil">
                            <ion-icon name="bicycle-outline" class="icone-card"></ion-icon>

                            <div class="texto-card">
                                <strong>Entregador</strong>
                                <span>Fazer Entregas</span>
                            </div>

                            <input type="radio" name="perfil" value="entregador">
                            <span class="custom-radio"></span>
                        </label>

                    </div>
                </fieldset>

                <div id="entrar">
                    <button type="submit" onclick="cadastrar(event)">Cadastrar</button>
                </div>

            </div>
        </form>
    </main>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&display=swap" rel="stylesheet">
    <script src="assets/js/app.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
