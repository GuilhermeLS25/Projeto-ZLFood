<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZL Food | Dashboard Administrativo</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kadwa:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Chart.js para renderizar o gráfico de forma simplificada -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="pg-dashboard">
    <div class="container">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <!-- Título -->
            <div class="box-1">
                <div class="btn btn-one">
                    <h2>SISTEMA ADMINISTRATIVO</h2>
                </div>
            </div>

            <!-- Botão Dashboard -->
            <div class="box-3">
                <a href="dashboard.html" class="btn btn-three">
                    <i class="fa-solid fa-chart-line"></i> DASHBOARD
                </a>
            </div>

            <!-- Botão Funcionários -->
            <div class="box-3">
                <a href="cadastro-moto.html" class="btn btn-three">
                    <i class="fa-solid fa-users"></i> FUNCIONÁRIOS
                </a>
            </div>

            <!-- Botão Cardápio -->
            <div class="box-3">
                <a href="cadastro-produtos.html" class="btn btn-three">
                    <i class="fa-solid fa-book-open"></i> CARDAPIO
                </a>
            </div>

            <!-- Botão Cupons -->
            <div class="box-3">
                <a href="cupons-admin.html" id="cupon" class="btn btn-three">
                    <i class="fa-solid fa-ticket"></i> GERENCIADOR DE CUPONS
                </a>
            </div>
        </aside>

        <section class="container-cartoes">
            <header class="topbar">
                <h1>Cadastro de Funcionarios</h1>
            </header>
            <div class="cartao">
                <div class="icone-circulo icone-verde">
                    $ </div>
                <div class="info-cartao">
                    <span class="titulo-cartao">Faturamento Mensal</span>
                    <strong class="valor-cartao">R$ 560,40</strong>
                </div>
            </div>

            <div class="cartao">
                <div class="icone-circulo icone-azul">
                    🛍️
                </div>
                <div class="info-cartao">
                    <span class="titulo-cartao">Qtd. de Pedidos</span>
                    <strong class="valor-cartao">3</strong>
                </div>
            </div>

            <div class="cartao">
                <div class="icone-circulo icone-roxo">
                    👤
                </div>
                <div class="info-cartao">
                    <span class="titulo-cartao">Último Comprador</span>
                    <strong class="valor-cartao">João Silva</strong>
                </div>
            </div>

        </section>
</body>

</html>
