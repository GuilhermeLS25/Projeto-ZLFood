<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZL Food | Dashboard Administrativo</title>
  <link rel="stylesheet" href="assets/css/style.css" />

  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="manifest" href="assets/images/site.webmanifest">
</head>
<style>
  body {
    background-image: none;
  }
</style>

<body>
  <div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>Sistema</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="cadastro-moto.html">Cadastros</a>
      <a href="cadastro-produtos.html">Produtos</a>
      <a href="#">Cardapio</a>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">
      <header class="topbar">
        <h1>Cadastro de Funcionarios</h1>
      </header>

      <!-- FORMULARIO DE CADASTRO -->
      <section class="card">
        <form id="cadastro-form">
          <input type="text" id="nome" placeholder="Nome do motoboy" />
          <input type="tel" id="telefone" placeholder="Telefone" />
          <input type="text" id="placa" placeholder="Placa da moto" />
          <input type="text" id="modelo" placeholder="Modelo da moto" />
          <button type="submit">Cadastrar</button>
        </form>
      </section>

      <!-- LISTA DE MOTOBOYS CADASTRADOS -->
      <section class="card">
        <h2>Motoboys Cadastrados</h2>
        <table id="tabelaMotoboys">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Placa</th>
              <th>Modelo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&display=swap" rel="stylesheet">
  <script src="assets/js/app.js"></script>
</body>

</html>
