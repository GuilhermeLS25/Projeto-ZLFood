<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZL Food | Dashboard Administrativo</title>
  <link rel="stylesheet" href="assets/css/style.css" />

  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="manifest" href="assets/images/site.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="pg-funcionarios">
  <div class="container">
    <aside class="sidebar">

      <div class="box-1">
        <div class="btn btn-one">
          <h2>SISTEMA ADMINISTRATIVO</h2>
        </div>
      </div>

      <div class="box-3">
        <a href="#" class="btn btn-three">
          <i class="fa-solid fa-chart-line"></i> DASHBOARD
        </a>
      </div>

      <div class="box-3">
        <a href="cadastro-moto.html" class="btn btn-three">
          <i class="fa-solid fa-users"></i> FUNCIONÁRIOS
        </a>
      </div>

      <div class="box-3">
        <a href="cadastro-produtos.html" class="btn btn-three">
          <i class="fa-solid fa-book-open"></i> CARDAPIO
        </a>
      </div>

      <div class="box-3">
        <a href="cupons-admin.html" id="cupon" class="btn btn-three">
          <i class="fa-solid fa-ticket"></i> GERENCIADOR DE CUPONS
        </a>
      </div>

    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Cadastro de Funcionarios</h1>
      </header>

      <section class="card">
        <form id="cadastro-form">
          <input type="text" id="nome" placeholder="Nome do motoboy" />
          <input type="tel" id="telefone" placeholder="Telefone" />
          <input type="text" id="placa" placeholder="Placa da moto" />
          <input type="text" id="modelo" placeholder="Modelo da moto" />
          <button type="submit">Cadastrar</button>
        </form>
      </section>

      <section class="card">
        <h2>Motoboys Cadastrados</h2>
        <table id="tabelaMotoboys">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Placa</th>
              <th>Modelo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>


</body>
<script src="assets/js/script.js"></script>
</html>
