<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>ZL Food | Gestão de Cardapio</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/site.webmanifest">
</head>

<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Sistema</h2>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="#">Cadastros</a>
            <a href="cadastro-produtos.html">Produtos</a>
            <a href="#">Relatórios</a>
        </aside>

        <main class="content">

            <header class="topbar">
                <h1>Cadastro de Produtos</h1>
            </header>

            <section class="card">

                <form id="produto-form">
                    <input type="text" id="produto" placeholder="Nome do produto">
                    <input type="number" id="quantidade" placeholder="Quantidade">
                    <input type="number" id="valor" placeholder="Valor unitário">
                    <button type="submit">
                        Adicionar
                    </button>
                </form>

                <table id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Valor</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>

                <button id="btn-finalizar" type="button">
                    Finalizar
                </button>

                <hr>

                <h3>
                    Total: R$
                    <span id="total">0.00</span>
                </h3>

                <input type="number" id="descontoValor" placeholder="Desconto em R$">

                <input type="number" id="descontoPercentual" placeholder="Desconto em %">

                <button id="btn-aplicar-desconto" type="button">
                    Aplicar Desconto
                </button>

                <h2>
                    Valor Líquido:
                    R$ <span id="valorLiquido">0.00</span>
                </h2>

            </section>

        </main>

    </div>

    <script src="assets/js/app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&display=swap" rel="stylesheet">
</body>

</html>
