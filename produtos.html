<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Sistema</h2>
            <a href="index.html">Dashboard</a>
            <a href="index.html">Cadastros</a>
            <a href="produtos.html">Produtos</a>
            <a href="#">Relatórios</a>
        </aside>

        <main class="content">

            <header class="topbar">
                <h1>Cadastro de Produtos</h1>
            </header>

            <section class="card">

                <form id="produto-form">
                    <input type="text" id="produto" placeholder="Nome do produto">
                    <input type="number" id="quantidade" placeholder="Quantidade">
                    <input type="number" id="valor" placeholder="Valor unitário">
                    <button type="submit">
                        Adicionar
                    </button>
                </form>

                <table id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Valor</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>

                <button id="btn-finalizar" type="button">
                    Finalizar
                </button>

                <hr>

                <h3>
                    Total: R$
                    <span id="total">0.00</span>
                </h3>

                <input type="number" id="descontoValor" placeholder="Desconto em R$">

                <input type="number" id="descontoPercentual" placeholder="Desconto em %">

                <button id="btn-aplicar-desconto" type="button">
                    Aplicar Desconto
                </button>

                <h2>
                    Valor Líquido:
                    R$ <span id="valorLiquido">0.00</span>
                </h2>

            </section>

        </main>

    </div>

    <script src="assets/js/app.js"></script>

</body>

</html>
