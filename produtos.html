<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Sistema</h2>
            <a href="index.html">Dashboard</a>
            <a href="index.html">Cadastros</a>
            <a href="produtos.html">Produtos</a>
            <a href="#">Relatórios</a>
        </aside>

        <main class="content">

            <header class="topbar">
                <h1>Cadastro de Produtos</h1>
            </header>

            <section class="card">

                <input type="text" id="produto" placeholder="Nome do produto">

                <input type="number" id="quantidade" placeholder="Quantidade">

                <input type="number" id="valor" placeholder="Valor unitário">

                <button onclick="adicionarProduto()">
                    Adicionar
                </button>

                <table id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Valor</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>

                

            </section>

        </main>

    </div>

    <script src="JS/script1.js"></script>

</body>

</html>
